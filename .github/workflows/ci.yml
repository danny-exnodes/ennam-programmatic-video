name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm cache (setup-node) also covers @sparticuz/chromium, the pinned
      # Chromium binary that golden-frame tests render with (scripts/golden.js)
      - run: npm ci --no-audit --no-fund
      # export pipeline tests (scripts/test-render-cache.js) need ffmpeg/ffprobe
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
      - name: Quality gate
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: npm run check
      - name: Upload golden-frame diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: test/golden/out/
          if-no-files-found: ignore
          retention-days: 7
